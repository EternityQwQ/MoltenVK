name: Build MoltenVK iOS arm64 dylib

# Manual-only workflow: start it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign outputs with ad-hoc codesign"
        required: false
        type: boolean
        default: true
      xcode_version:
        description: "Xcode version to use, e.g. 16.4 (empty = runner default)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-dylib-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-dylib:
    name: MoltenVK (iOS arm64 dylib)
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode (optional)
        if: ${{ inputs.xcode_version != '' }}
        env:
          XCODE_VERSION: ${{ inputs.xcode_version }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"

      - name: Show Xcode version
        id: prep
        run: |
          xcodebuild -version
          echo "XCODE_VERSION=$(xcodebuild -version | tr '\t\r\n ' '_')" >> "$GITHUB_OUTPUT"

      # Python 3.12 removed distutils, which is used by
      # glslang::update_glslang_sources.py called from fetchDependencies.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore ccache
        id: cache-ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ steps.prep.outputs.XCODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.prep.outputs.XCODE_VERSION }}-

      # Install ccache and point Xcode's compiler settings at its masquerade
      # symlinks, so every C/C++/ObjC/ObjC++ compile (including the external
      # dependency builds) is cached.
      - name: Install and configure ccache
        run: |
          if ! command -v ccache >/dev/null 2>&1; then
            brew install ccache
          fi
          export CCACHE_DIR="$HOME/.ccache"
          mkdir -p "$CCACHE_DIR" "$RUNNER_TEMP/ccache-bin"

          CCACHE_BIN="$(command -v ccache)"
          for tool in clang clang++ cc c++; do
            ln -sf "$CCACHE_BIN" "$RUNNER_TEMP/ccache-bin/$tool"
          done

          cat > "$RUNNER_TEMP/ccache.xcconfig" <<EOF
          CC = $RUNNER_TEMP/ccache-bin/clang
          CXX = $RUNNER_TEMP/ccache-bin/clang++
          OBJC = $RUNNER_TEMP/ccache-bin/clang
          OBJCXX = $RUNNER_TEMP/ccache-bin/clang++
          EOF

          # Make sure ccache's masquerade wrappers can find the real compiler.
          echo "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin" >> "$GITHUB_PATH"

          ccache --max-size=1G
          ccache --set-config=compression=true
          ccache --zero-stats
          ccache --show-config | grep -E "max_size|compression" || true

          {
            echo "CCACHE_DIR=$CCACHE_DIR"
            echo "CCACHE_SLOPPINESS=clang_index_store,include_file_ctime,include_file_mtime,locale,pch_defines,time_macros"
            echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/ccache.xcconfig"
          } >> "$GITHUB_ENV"

      - name: Cache external dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            External
            !External/build/Intermediates
          key: moltenvk-ios-${{ runner.os }}-${{ steps.prep.outputs.XCODE_VERSION }}-${{ hashFiles('ExternalRevisions/**', 'fetchDependencies', 'ExternalDependencies.xcodeproj/**', 'Scripts/**') }}

      - name: Fetch dependencies (cache hit)
        if: steps.cache-dependencies.outputs.cache-hit == 'true'
        run: echo "Using cached External/ dependencies"

      - name: Fetch iOS dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: ./fetchDependencies --ios

      - name: Build MoltenVK package (iOS only)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MoltenVKPackaging.xcodeproj \
            -scheme "MoltenVK Package (iOS only)" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log

      - name: Cache summary
        if: always()
        run: |
          set -u

          EXTERNAL_CACHE="n/a"
          if [ "${{ steps.cache-dependencies.outcome }}" = "success" ]; then
            EXTERNAL_CACHE="miss"
            if [ "${{ steps.cache-dependencies.outputs.cache-hit }}" = "true" ]; then
              EXTERNAL_CACHE="hit"
            fi
          fi

          CCACHE_CACHE="n/a"
          if [ "${{ steps.cache-ccache.outcome }}" = "success" ]; then
            CCACHE_CACHE="miss"
            if [ -n "${{ steps.cache-ccache.outputs.cache-matched-key }}" ]; then
              CCACHE_CACHE="partial"
              if [ "${{ steps.cache-ccache.outputs.cache-hit }}" = "true" ]; then
                CCACHE_CACHE="hit"
              fi
            fi
          fi

          HIT_RATE="n/a"
          HIT_LINE=""
          if command -v ccache >/dev/null 2>&1; then
            STATS="$(ccache --show-stats 2>/dev/null || true)"
            printf '%s\n' "${STATS}"
            HIT_LINE="$(printf '%s\n' "${STATS}" | awk '/^[[:space:]]*Hits:/ {print; exit}')"
            HIT_RATE="$(printf '%s\n' "${STATS}" | awk '/^[[:space:]]*Hits:/ && $NF ~ /%/ {gsub(/[()%]/,"",$NF); print $NF; exit}')"
            if [ -z "${HIT_RATE}" ]; then
              HIT_RATE="n/a"
            fi
          fi

          echo "::notice title=Cache stats::External=${EXTERNAL_CACHE}; ccache archive=${CCACHE_CACHE}; ccache compile=${HIT_RATE}"

          {
            echo "## Cache summary"
            echo
            echo "| Item | Result |"
            echo "|---|---|"
            echo "| External dependencies cache | ${EXTERNAL_CACHE} |"
            echo "| ccache archive | ${CCACHE_CACHE} |"
            echo "| ccache compile hit rate | ${HIT_RATE} |"
            if [ -n "${HIT_LINE}" ]; then
              echo
              echo '```'
              echo "${HIT_LINE}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package libMoltenVK.dylib (arm64)
        run: |
          set -euo pipefail

          FW_DIR="$(find Package/Release/MoltenVK/dynamic -type d -name 'MoltenVK.framework' -path '*ios-arm64*' -print -quit || true)"
          if [ -z "${FW_DIR}" ]; then
            echo "ERROR: MoltenVK.framework (ios-arm64) not found. Built packages:"
            find Package -maxdepth 5 -print || true
            exit 1
          fi

          OUT="$PWD/artifacts"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          assert_arm64() {
            local path="$1"
            local archs
            archs="$(lipo -archs "${path}")"
            echo "architecture(s) ${path}: ${archs}"
            case " ${archs} " in
              *" arm64 "*) ;;
              *) echo "ERROR: arm64 slice not found in ${path}"; exit 1 ;;
            esac
          }

          DYLIB="${OUT}/libMoltenVK.dylib"
          cp "${FW_DIR}/MoltenVK" "${DYLIB}"

          assert_arm64 "${DYLIB}"
          if [ "$(lipo -archs "${DYLIB}")" != "arm64" ]; then
            lipo -thin arm64 "${DYLIB}" -output "${DYLIB}.arm64"
            mv "${DYLIB}.arm64" "${DYLIB}"
          fi
          [ "$(lipo -archs "${DYLIB}")" = "arm64" ] || {
            echo "ERROR: expected a thin arm64 dylib"
            exit 1
          }

          install_name_tool -id "@rpath/libMoltenVK.dylib" "${DYLIB}"

          # Also ship the original ios-arm64 framework bundle.
          cp -R "${FW_DIR}" "${OUT}/MoltenVK.framework"
          assert_arm64 "${OUT}/MoltenVK.framework/MoltenVK"
          vtool -show-build "${OUT}/MoltenVK.framework/MoltenVK"

          otool -L "${DYLIB}"
          vtool -show-build "${DYLIB}"

      - name: Sign outputs (ad-hoc)
        if: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          for f in artifacts/libMoltenVK.dylib artifacts/MoltenVK.framework; do
            echo ">>> Signing $f"
            codesign --force --sign - "$f"
          done

      - name: Verify ad-hoc signatures
        if: ${{ inputs.sign }}
        run: |
          set -euo pipefail

          verify_adhoc() {
            local path="$1"
            echo ">>> Verifying $path"

            # Fails the job if the signature is missing or the code has been modified.
            # Verify the Mach-O itself: stricter bundle-level checks on a framework
            # can fail on resource-envelope details that do not affect loading.
            codesign --verify --strict --verbose=2 "$path"

            local dv
            dv="$(codesign -dv "$path" 2>&1 || true)"
            echo "$dv"
            if ! grep -q "Signature=adhoc" <<< "$dv"; then
              echo "::error title=Signature verification failed::$path is not ad-hoc signed"
              exit 1
            fi
          }

          verify_adhoc artifacts/libMoltenVK.dylib
          verify_adhoc artifacts/MoltenVK.framework/MoltenVK

          echo "All outputs are valid ad-hoc signatures."

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoltenVK-ios-arm64${{ inputs.sign && '-signed' || '' }}
          path: |
            artifacts/libMoltenVK.dylib
            artifacts/MoltenVK.framework
          if-no-files-found: error

      - name: Show build logs on failure
        if: failure()
        run: |
          for log in xcodebuild.log dependenciesbuild.log; do
            if [ -f "$log" ]; then
              echo "===== tail of $log ====="
              tail -n 200 "$log"
            fi
          done
