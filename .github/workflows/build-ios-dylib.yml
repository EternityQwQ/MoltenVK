name: Build MoltenVK iOS arm64 dylib

# Manual-only workflow: start it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Sign outputs with ad-hoc codesign"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build-ios-dylib:
    name: MoltenVK (iOS arm64 dylib)
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show Xcode version
        id: prep
        run: |
          xcodebuild -version
          echo "XCODE_VERSION=$(xcodebuild -version | tr '\t\r\n ' '_')" >> "$GITHUB_OUTPUT"

      # Python 3.12 removed distutils, which is used by
      # glslang::update_glslang_sources.py called from fetchDependencies.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ steps.prep.outputs.XCODE_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.prep.outputs.XCODE_VERSION }}-

      # Install ccache and point Xcode's compiler settings at its masquerade
      # symlinks, so every C/C++/ObjC/ObjC++ compile (including the external
      # dependency builds) is cached.
      - name: Install and configure ccache
        run: |
          brew install ccache
          export CCACHE_DIR="$HOME/.ccache"
          mkdir -p "$CCACHE_DIR" "$RUNNER_TEMP/ccache-bin"

          CCACHE_BIN="$(command -v ccache)"
          for tool in clang clang++ cc c++; do
            ln -sf "$CCACHE_BIN" "$RUNNER_TEMP/ccache-bin/$tool"
          done

          cat > "$RUNNER_TEMP/ccache.xcconfig" <<EOF
          CC = $RUNNER_TEMP/ccache-bin/clang
          CXX = $RUNNER_TEMP/ccache-bin/clang++
          OBJC = $RUNNER_TEMP/ccache-bin/clang
          OBJCXX = $RUNNER_TEMP/ccache-bin/clang++
          EOF

          # Make sure ccache's masquerade wrappers can find the real compiler.
          echo "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/bin" >> "$GITHUB_PATH"

          ccache --max-size=2G
          ccache --set-config=compression=true
          ccache --zero-stats
          ccache --show-config | grep -E "max_size|compression" || true

          {
            echo "CCACHE_DIR=$CCACHE_DIR"
            echo "CCACHE_SLOPPINESS=clang_index_store,include_file_ctime,include_file_mtime,locale,pch_defines,time_macros"
            echo "XCODE_XCCONFIG_FILE=$RUNNER_TEMP/ccache.xcconfig"
          } >> "$GITHUB_ENV"

      - name: Cache external dependencies
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: External
          key: moltenvk-ios-${{ runner.os }}-${{ steps.prep.outputs.XCODE_VERSION }}-${{ hashFiles('ExternalRevisions/**', 'fetchDependencies') }}

      - name: Fetch dependencies (cache hit)
        if: steps.cache-dependencies.outputs.cache-hit == 'true'
        run: ./fetchDependencies -v --none

      - name: Fetch iOS dependencies
        if: steps.cache-dependencies.outputs.cache-hit != 'true'
        run: ./fetchDependencies -v --ios

      - name: Build MoltenVK package (iOS only)
        run: |
          set -o pipefail
          xcodebuild build \
            -project MoltenVKPackaging.xcodeproj \
            -scheme "MoltenVK Package (iOS only)" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats || true

      - name: Package libMoltenVK.dylib (arm64)
        run: |
          set -euo pipefail

          FW_DIR="$(find Package/Release/MoltenVK/dynamic -type d -name 'MoltenVK.framework' -path '*ios-arm64*' -print -quit)"
          if [ -z "${FW_DIR}" ]; then
            echo "ERROR: MoltenVK.framework (ios-arm64) not found. Built packages:"
            find Package -maxdepth 5 -print || true
            exit 1
          fi

          OUT="$PWD/artifacts"
          rm -rf "${OUT}"
          mkdir -p "${OUT}"

          cp "${FW_DIR}/MoltenVK" "${OUT}/libMoltenVK.dylib"
          if lipo -info "${OUT}/libMoltenVK.dylib" | grep -q "Architectures in the fat file"; then
            lipo -thin arm64 "${OUT}/libMoltenVK.dylib" -output "${OUT}/libMoltenVK.dylib.arm64"
            mv "${OUT}/libMoltenVK.dylib.arm64" "${OUT}/libMoltenVK.dylib"
          fi
          install_name_tool -id "@rpath/libMoltenVK.dylib" "${OUT}/libMoltenVK.dylib"

          # Also ship the original ios-arm64 framework bundle.
          cp -R "${FW_DIR}" "${OUT}/MoltenVK.framework"
          lipo -info "${OUT}/MoltenVK.framework/MoltenVK"
          vtool -show-build "${OUT}/MoltenVK.framework/MoltenVK"

          lipo -info "${OUT}/libMoltenVK.dylib"
          otool -L "${OUT}/libMoltenVK.dylib"
          vtool -show-build "${OUT}/libMoltenVK.dylib"

      - name: Sign outputs (ad-hoc)
        if: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          for f in artifacts/libMoltenVK.dylib artifacts/MoltenVK.framework; do
            echo ">>> Signing $f"
            codesign --force --sign - "$f"
          done

      - name: Verify ad-hoc signatures
        if: ${{ inputs.sign }}
        run: |
          set -euo pipefail
          for f in artifacts/libMoltenVK.dylib artifacts/MoltenVK.framework; do
            echo ">>> Verifying $f"

            # Fails the job if the signature is missing or the code has been modified.
            codesign --verify --strict --verbose=2 "$f"

            DV="$(codesign -dv "$f" 2>&1 || true)"
            echo "$DV"
            if ! grep -q "Signature=adhoc" <<< "$DV"; then
              echo "::error title=Signature verification failed::$f is not ad-hoc signed"
              exit 1
            fi
          done
          echo "All outputs are valid ad-hoc signatures."

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoltenVK-ios-arm64-dylib${{ inputs.sign && '-signed' || '' }}
          path: |
            artifacts/libMoltenVK.dylib
            artifacts/MoltenVK.framework
          if-no-files-found: error

      - name: Show build log on failure
        if: failure()
        run: cat xcodebuild.log || true
